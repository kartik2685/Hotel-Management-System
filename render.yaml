# Render Blueprint: the whole app as one free web service, with the data in Supabase.
#
#   Render → New → Blueprint → connect this repository → pick the branch → fill in the four values → Deploy Blueprint
#
# Render asks once, while creating the Blueprint, for the values marked "sync: false" (they never go into Git):
#   DATABASE_URL    Supabase → Connect → Session pooler, with [YOUR-PASSWORD] replaced by the database password
#   ADMIN_EMAIL     your sign-in email: the app starts as an empty hotel with this admin account
#   ADMIN_PASSWORD  your sign-in password, 8 characters or more
#   HOTEL_NAME      the hotel's name (can be changed later in Admin → Hotel settings)
# Leave ADMIN_EMAIL empty to load the demo hotel instead; its staff password is then printed once in the Logs.
# The tables are created in Supabase on the first start. Step by step: docs/SETUP-SUPABASE-RENDER.md
services:
  - type: web
    name: hotel-management-system
    runtime: node
    plan: free
    region: singapore # pick the same region (Southeast Asia / Singapore) for the Supabase project
    branch: arena/dfe46868-hotel-management-system # the branch with this code (main, once it is merged)
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: HOTEL_NAME
        sync: false
