<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No connection · Frontdesk</title>
  <meta name="theme-color" content="#1c1b19">
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: #f3efe6; color: #1c1b19; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 420px; text-align: center; }
    svg { width: 72px; height: 72px; }
    h1 { margin: 18px 0 8px; font-family: Georgia, "Times New Roman", serif; font-size: 1.9rem; font-weight: 500; }
    p { margin: 0 0 22px; color: #5d574c; }
    a {
      display: inline-block; padding: 12px 22px; border-radius: 12px; background: #1c1b19; color: #fff;
      font-weight: 600; text-decoration: none;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #141311; color: #f3efe6; }
      p { color: #b9b1a3; }
      a { background: #c9a263; color: #1c1b19; }
    }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#1c1b19"/><path transform="translate(0 -1)" d="M7 22h18M8.5 22a7.5 7.5 0 0 1 15 0M16 14.5V12M14 12h4" fill="none" stroke="#c9a263" stroke-width="2" stroke-linecap="round"/></svg>
    <h1>No connection</h1>
    <p>Frontdesk needs the internet to show bookings, rooms and guests. Check the Wi-Fi or mobile data, then try again.</p>
    <a href="">Try again</a>
  </main>
</body>
</html>
